---
# OpenSpec Configuration — arnold
# Spec-Driven Development (SDD) for structured change management

project: arnold
version: "1.0"
created: 2026-08-10

context: |
  arnold is a Next.js 16 React 19 frontend application with Clean Architecture
  principles. The project uses ESLint for linting and TypeScript strict mode.
  No test framework is currently configured.
  
  Architectural patterns: Clean Architecture, TDD, Atomic Design, SDD.
  Primary layers: models, adapters, services, components, app, utilities.

strict_tdd: true
tdd_reason: "Jest configured with ts-jest; TDD mode enforced for Phase 1 MVP Core"

testing:
  runner: jest
  framework: ts-jest
  unit_available: true
  integration_available: false
  e2e_available: false
  coverage_available: true
  test_command: "npm test"
  coverage_command: "npm run test:coverage"
  linter:
    name: ESLint
    command: "eslint"
  type_checker:
    name: TypeScript
    command: "tsc --noEmit"
  formatter: null

phases:
  proposal:
    required_fields:
      - intent
      - scope
      - stakeholder_impact
  spec:
    required_fields:
      - requirements
      - acceptance_criteria
      - test_scenarios
  design:
    required_fields:
      - approach
      - architecture
      - implementation_plan
  tasks:
    required_fields:
      - task_breakdown
      - dependencies
      - acceptance_tests
  apply:
    required_fields:
      - implementation_checklist
      - test_results
  verify:
    required_fields:
      - test_coverage
      - acceptance_proof
  archive:
    required_fields:
      - completion_summary
      - delta_specs
