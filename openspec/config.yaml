---
# OpenSpec Configuration — arnold
# Spec-Driven Development (SDD) for structured change management

project: arnold
version: "1.0"
created: 2026-08-10

context: |
  arnold is a gym management system (socios, cuotas, access control, routines and cash desk):
  Next.js 16 (Turbopack) + React 19 + TypeScript in strict mode + Prisma 6 on PostgreSQL.
  ESLint for linting, and Jest with ts-jest as the test framework (jsdom unit tests plus an
  integration suite against an ephemeral Postgres in Docker).
  
  Architectural patterns: layered architecture (routes -> api -> pure domains -> lib), TDD, SDD.
  Real layers: src/app, src/api, src/domains, src/lib, src/components, src/contexts, src/utils.

strict_tdd: true
tdd_reason: "Jest configured with ts-jest; TDD mode enforced for Phase 1 MVP Core"

testing:
  runner: jest
  framework: ts-jest
  unit_available: true
  integration_available: true
  e2e_available: false
  coverage_available: true
  test_command: "npm test"
  coverage_command: "npm run test:coverage"
  integration_command: "npm run test:integration"
  linter:
    name: ESLint
    command: "eslint"
  type_checker:
    name: TypeScript
    command: "tsc --noEmit"
  formatter: null

phases:
  proposal:
    required_fields:
      - intent
      - scope
      - stakeholder_impact
  spec:
    required_fields:
      - requirements
      - acceptance_criteria
      - test_scenarios
  design:
    required_fields:
      - approach
      - architecture
      - implementation_plan
  tasks:
    required_fields:
      - task_breakdown
      - dependencies
      - acceptance_tests
  apply:
    required_fields:
      - implementation_checklist
      - test_results
  verify:
    required_fields:
      - test_coverage
      - acceptance_proof
  archive:
    required_fields:
      - completion_summary
      - delta_specs
